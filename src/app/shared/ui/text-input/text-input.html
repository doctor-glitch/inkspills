<label class="label" [for]="id">
  {{ label() }}
  @if (required()) {
    <span class="visually-hidden">(required)</span>
  }
</label>

<div class="field" [class.field--error]="showError()" [class.field--disabled]="disabled()">
  <input
    #input
    class="control"
    [id]="id"
    [attr.name]="name() || null"
    [type]="inputType()"
    [value]="value()"
    [placeholder]="placeholder()"
    [disabled]="disabled()"
    [readOnly]="readonly()"
    [required]="required()"
    [attr.autocomplete]="autocomplete() ?? null"
    [attr.inputmode]="inputmode() ?? null"
    [attr.aria-invalid]="showError() ? 'true' : null"
    [attr.aria-describedby]="describedBy()"
    (input)="onInput($event)"
    (blur)="touch.emit()"
  />

  @if (showError()) {
    <app-icon class="field__icon field__icon--error" name="alert-circle" [size]="16" />
  } @else if (type() === 'password') {
    <button
      type="button"
      class="field__reveal"
      [attr.aria-pressed]="revealed()"
      [attr.aria-label]="revealed() ? 'Hide password' : 'Show password'"
      [attr.aria-controls]="id"
      (click)="toggleReveal()"
    >
      <app-icon name="eye" [size]="18" />
    </button>
  }
</div>

@if (showError()) {
  <p class="message message--error" [id]="errorId" role="alert">{{ errorMessage() }}</p>
}
@if (hint()) {
  <p class="message" [id]="hintId">{{ hint() }}</p>
}
